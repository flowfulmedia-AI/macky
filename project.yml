# Xcode project definition. The .xcodeproj is generated from this file with `xcodegen generate`
# (run automatically by `make run`), so it never has to be edited or committed by hand.
name: Macky

options:
  bundleIdPrefix: com.flowfulmedia
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  developmentLanguage: ro

packages:
  MackyCore:
    path: Packages/MackyCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"

targets:
  Macky:
    type: application
    platform: macOS
    sources:
      - path: Macky
    dependencies:
      - package: MackyCore
      - package: WhisperKit
      - sdk: libsqlite3.tbd
        product: WhisperKit
    info:
      path: Macky/Info.plist
      properties:
        CFBundleDisplayName: Macky
        # Built by scripts/make-icon.sh from Macky/Resources/AppIcon.png.
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only: no Dock icon, no main window.
        LSUIElement: true
        NSMicrophoneUsageDescription: Macky te ascultă doar cât ții apăsată scurtătura, ca să-ți înțeleagă întrebarea.
        NSCalendarsFullAccessUsageDescription: Macky citește și adaugă evenimente în Calendar când îi ceri.
        NSCalendarsUsageDescription: Macky citește și adaugă evenimente în Calendar când îi ceri.
        NSRemindersFullAccessUsageDescription: Macky citește și adaugă remindere când îi ceri.
        NSRemindersUsageDescription: Macky citește și adaugă remindere când îi ceri.
        NSAppleEventsUsageDescription: Macky controlează direct aplicații precum Spotify sau Safari doar când îi ceri tu, ca sarcinile să meargă repede.
        NSSpeechRecognitionUsageDescription: Macky poate folosi recunoașterea vocală Apple ca alternativă la Whisper local.
        NSHumanReadableCopyright: Macky — aplicație personală.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowfulmedia.macky
        PRODUCT_NAME: Macky
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # Signed with a free, self-made certificate (scripts/create-signing-identity.sh).
        # A stable signature is what keeps macOS permissions granted between builds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Macky Local Signing
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Macky:
    build:
      targets:
        Macky: all
    run:
      config: Debug
    archive:
      config: Release
